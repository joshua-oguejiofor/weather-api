{% extends "base.html" %}

{% block title %}Verify your email{% endblock %}

{% block content %}

  <h2>Welcome to Weather App</h2>
  
  <p>Hi {{ first_name }}, </p>

  <p>Thanks for signing up! Please confirm your email by clicking the button below.</p>

  <p>
    
    <a href="https://127.0.0.1:8000/api/v1/auth/verify-email?token={{ verify_link }}"
       style="display: inline-block; padding: 10px 20px; background-color: #95d297;
              color: #ffffff; text-decoration: none; border-radius: 4px;">
      Click Here to Verify Your Email
    </a>
  </p>

  
{% endblock %}
